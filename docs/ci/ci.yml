name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Tests · Builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (scan engine)
        run: npx playwright install --with-deps chromium

      - name: Typecheck (packages, worker, extension, web)
        run: npm run typecheck && npm run -w @consenttrace/web typecheck

      - name: Unit + integration + scanner E2E tests
        # Includes: SSRF suite, rule engine, evidence integrity, extension logic,
        # real-Postgres integration (embedded PG 17), Playwright fixture scans
        # (clean site, intentional regression vs baseline, prompt-injection-safe
        # fixtures), Stripe signature + webhook idempotency.
        run: npm test

      - name: Build web app
        run: npm run -w @consenttrace/web build
        env:
          CT_DISABLE_RUNNER: 'true'

      - name: Build + package extension
        # Icons are generated assets (docs/ASSETS.md) — create them before building.
        run: |
          npm run -w @consenttrace/extension icons
          npm run -w @consenttrace/extension build
          npm run -w @consenttrace/extension zip

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: consenttrace-extension-chrome
          path: apps/extension/.output/*.zip
          retention-days: 30
